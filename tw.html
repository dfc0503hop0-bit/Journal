<title>台股交易日誌</title>
<!-- PWA manifest 內嵌,讓「加到主畫面」有正確圖示與名稱 -->
<link rel="manifest" id="manifest-placeholder" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230e1116'/%3E%3Cpath%20d='M20%2070%20L35%2050%20L50%2060%20L80%2030'%20stroke='%231fb87a'%20stroke-width='6'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='80'%20cy='30'%20r='6'%20fill='%234a9eda'/%3E%3C/svg%3E" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0e1116; }
  body { font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  input, select, textarea { font-family: inherit; font-size: 16px; }  /* 16px 避免 iOS 自動放大 */
  /* 欄位一律可縮,不可撐破格子(iOS 的原生日期/時間欄位預設有最小固有寬度,會疊到隔壁) */
  input, select, textarea { min-width: 0; max-width: 100%; }
  input[type="date"], input[type="time"] {
    -webkit-appearance: none; appearance: none;
    text-align: left; min-width: 0; max-width: 100%;
  }
  button { cursor: pointer; border: none; font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2a323d; border-radius: 3px; }
  /* 安全區域(瀏海/底部手勢列) */
  #root { padding-top: env(safe-area-inset-top); }
</style>
<script>
// 全域錯誤監聽:任何錯誤都顯示出來
function showErr(title, detail) {
  var root = document.getElementById("root");
  if (root && document.getElementById("loadstatus")) {
    root.innerHTML = '<div style="color:#e8482b;font-family:monospace;padding:40px 20px;font-size:12px;white-space:pre-wrap;word-break:break-word;">' +
      title + '\n' + detail + '</div>';
  }
}
window.addEventListener("error", function (e) {
  var d = (e.message || "未知");
  if (e.error && e.error.stack) d += "\n\n" + e.error.stack;
  if (e.filename) d += "\n\n" + e.filename + (e.lineno ? " 第" + e.lineno + "行" : "");
  showErr("發生錯誤:", d);
});
window.addEventListener("unhandledrejection", function (e) {
  showErr("Promise 錯誤:", (e.reason && e.reason.message) ? e.reason.message : String(e.reason));
});
</script>
</head>

<div id="root"><div id="loadstatus" style="color:#7d8794;font-family:sans-serif;text-align:center;padding:60px 24px;line-height:2;">載入中…<br><span style="font-size:12px;" id="ls-detail">準備中</span></div></div>

<script>
window.__updateStatus = function () {
  var l = window.__libsLoaded || {};
  var el = document.getElementById("ls-detail");
  if (!el) return;
  el.innerHTML =
    "React " + (l.react ? "✓" : "…") + " &nbsp; " +
    "ReactDOM " + (l.dom ? "✓" : "…") + "<br>" +
    "Babel " + (l.babel ? "✓" : "…") +
    (l.react && l.dom && l.babel ? "<br>元件就緒,編譯中…" : "");
};
</script>

<script>

window.__loadTimeout = setTimeout(function () {
  var l = window.__libsLoaded;
  if (!(l.react && l.dom && l.babel)) {
    var miss = [];
    if (!l.react) miss.push("React");
    if (!l.dom) miss.push("ReactDOM");

      '<div style="color:#7d8794;font-size:13px;margin-bottom:20px;">未載入: ' + miss.join("、") + '<br>可能是網路較慢,請重試</div>' +
      '<button onclick="location.reload()" style="background:#4a9eda;color:#000;font-weight:600;font-size:15px;padding:12px 28px;border:none;border-radius:10px;">重新載入</button>' +
      '</div>';
  }

<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" onload="window.__libsLoaded.dom=true;window.__updateStatus()"></script>

<script>
// ============================================================
// 動態產生 PWA manifest
// ============================================================
const iconSvg = "data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230e1116'/%3E%3Cpath%20d='M20%2070%20L35%2050%20L50%2060%20L80%2030'%20stroke='%231fb87a'%20stroke-width='6'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='80'%20cy='30'%20r='6'%20fill='%234a9eda'/%3E%3C/svg%3E";
const manifest = {
  name: "台股交易日誌", short_name: "台股日誌",
  start_url: "./tw.html", display: "standalone",
  background_color: "#0e1116", theme_color: "#0e1116",
  icons: [{ src: iconSvg, sizes: "any", type: "image/svg+xml" }],
};
const mBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
document.getElementById("manifest-placeholder").setAttribute("href", URL.createObjectURL(mBlob));

// ============================================================
// IndexedDB 儲存層 —— 注意:DB 名稱和美股那本「完全分開」,兩邊資料不會互相干擾
// ============================================================
const DB_NAME = "tradeJournalTwDB";
const STORE = "trades";
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(trade) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(trade);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbBulkPut(trades) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    trades.forEach((t) => store.put(t));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbClear() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
</script>

<script type="text/plain" id="app-source">
const { useState, useMemo, useRef, useEffect } = React;

// ============================================================
// 顏色慣例:綠=賺 紅=賠 (對調只需互換下面兩個常數值)
// ============================================================
const PROFIT_COLOR = "#1fb87a";
const LOSS_COLOR = "#e8482b";
const profitBg = (a) => `rgba(31,184,122,${a})`;
const lossBg = (a) => `rgba(232,72,43,${a})`;
const ACCENT = "#4a9eda";        // 台股版用藍色,和美股版的金色區隔
const BG = "#0e1116";
const PANEL = "#161b22";
const PANEL2 = "#1c232c";
const BORDER = "#2a323d";
const TEXT = "#e6edf3";
const MUTED = "#7d8794";

// ============================================================
// 幣別:新台幣
// ============================================================
const CCY = "NT$";
const pnlColor = (v) => (v > 0 ? PROFIT_COLOR : v < 0 ? LOSS_COLOR : MUTED);
const fmtAmt = (v) =>
  (v >= 0 ? "+" : "−") +
  Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtMoney = (v) => (v >= 0 ? "+" : "−") + CCY +
  Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// 手機空間小,大數字用「萬」簡寫(僅圖表軸與月曆用)
const fmtShort = (v) => {
  const a = Math.abs(v);
  const s = v >= 0 ? "+" : "−";
  if (a >= 10000) return s + (a / 10000).toFixed(a >= 100000 ? 0 : 1) + "萬";
  return s + Math.round(a).toLocaleString();
};
const fmtR = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "R";
const fmtNum = (v) => (v == null || v === "" ? "—" : String(v));

// ============================================================
// 純 SVG 圖表元件(不依賴任何圖表庫)
// ============================================================
const CHART_W = 320, CHART_H = 170, PAD_L = 44, PAD_R = 8, PAD_T = 10, PAD_B = 22;

function yScale(values, h) {
  let min = Math.min(0, ...values), max = Math.max(0, ...values);
  if (min === max) { max = max + 1; min = min - 1; }
  const range = max - min;
  const innerH = h - PAD_T - PAD_B;
  const toY = (v) => PAD_T + innerH * (1 - (v - min) / range);
  return { min, max, toY, zeroY: toY(0) };
}
// 台幣金額大,軸標籤用萬/千簡寫
function fmtAxis(v) {
  const a = Math.abs(v);
  if (a >= 10000) return (v / 10000).toFixed(a >= 100000 ? 0 : 1) + "萬";
  if (a >= 1000) return (v / 1000).toFixed(1) + "k";
  return Math.round(v).toString();
}

// 互動 hook
function useChartHover(dataLength, toIndexFromX) {
  const [active, setActive] = useState(null);
  const svgRef = useRef(null);
  const handle = (clientX) => {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const vbX = ((clientX - rect.left) / rect.width) * CHART_W;
    const idx = toIndexFromX(vbX);
    if (idx != null && idx >= 0 && idx < dataLength) setActive(idx);
  };
  const clear = () => setActive(null);
  return { active, svgRef, bind: {
    onTouchStart: (e) => { if (e.touches[0]) handle(e.touches[0].clientX); },
    onTouchMove: (e) => { if (e.touches[0]) handle(e.touches[0].clientX); },
    onTouchEnd: clear,
    onMouseMove: (e) => handle(e.clientX),
    onMouseLeave: clear,
    style: { touchAction: "pan-y" },
  }};
}

// 折線+漸層面積圖(每日淨累積)
function AreaLineChart({ data, color }) {
  if (!data.length) return <div style={{ textAlign: "center", color: MUTED, fontSize: 12, padding: "30px 0" }}>此區間沒有交易紀錄</div>;
  const vals = data.map((d) => d.cum);
  const { min, max, toY, zeroY } = yScale(vals, CHART_H);
  const innerW = CHART_W - PAD_L - PAD_R;
  const toX = (i) => PAD_L + (data.length === 1 ? innerW / 2 : innerW * i / (data.length - 1));
  const toIndexFromX = (vbX) => {
    if (data.length === 1) return 0;
    const i = Math.round((vbX - PAD_L) / (innerW / (data.length - 1)));
    return Math.max(0, Math.min(data.length - 1, i));
  };
  const { active, svgRef, bind } = useChartHover(data.length, toIndexFromX);
  const linePts = data.map((d, i) => `${toX(i)},${toY(d.cum)}`).join(" ");
  const lastPos = data[data.length - 1].cum >= 0;
  const areaFill = lastPos ? color.profit : color.loss;
  const areaPath = `M ${toX(0)},${zeroY} L ` + data.map((d, i) => `${toX(i)},${toY(d.cum)}`).join(" L ") + ` L ${toX(data.length - 1)},${zeroY} Z`;
  const ticks = [max, (max + min) / 2, min];
  const ad = active != null ? data[active] : null;
  return (
    <svg ref={svgRef} {...bind} viewBox={`0 0 ${CHART_W} ${CHART_H}`} style={{ width: "100%", height: "auto", touchAction: "pan-y" }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={PAD_L} y1={toY(t)} x2={CHART_W - PAD_R} y2={toY(t)} stroke={BORDER} strokeWidth="0.5" strokeDasharray="2 2" />
          <text x={PAD_L - 4} y={toY(t) + 3} textAnchor="end" fontSize="8" fill={MUTED}>{fmtAxis(t)}</text>
        </g>
      ))}
      <line x1={PAD_L} y1={zeroY} x2={CHART_W - PAD_R} y2={zeroY} stroke={BORDER} strokeWidth="1" />
      <path d={areaPath} fill={areaFill} fillOpacity="0.18" />
      <polyline points={linePts} fill="none" stroke={ACCENT} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((d, i) => (
        <text key={i} x={toX(i)} y={CHART_H - 6}
          textAnchor={i === 0 ? "start" : i === data.length - 1 ? "end" : "middle"}
          fontSize="7" fill={MUTED}
          style={{ display: (i === 0 || i === data.length - 1 || i === Math.floor(data.length / 2)) ? "block" : "none" }}>{d.date.slice(5)}</text>
      ))}
      {ad && <ChartCursor x={toX(active)} y={toY(ad.cum)} label={ad.date.slice(5)} value={fmtShort(ad.cum)} />}
    </svg>
  );
}

// 指示線 + 數值氣泡
function ChartCursor({ x, y, label, value }) {
  const boxW = 84, boxH = 30;
  let bx = x - boxW / 2;
  if (bx < 2) bx = 2;
  if (bx + boxW > CHART_W - 2) bx = CHART_W - 2 - boxW;
  const by = 2;
  return (
    <g pointerEvents="none">
      <line x1={x} y1={PAD_T} x2={x} y2={CHART_H - PAD_B} stroke={ACCENT} strokeWidth="1" strokeDasharray="3 2" />
      <circle cx={x} cy={y} r="3.5" fill={ACCENT} stroke={BG} strokeWidth="1.5" />
      <rect x={bx} y={by} width={boxW} height={boxH} rx="4" fill={PANEL2} stroke={BORDER} strokeWidth="0.5" />
      <text x={bx + boxW / 2} y={by + 12} textAnchor="middle" fontSize="8" fill={MUTED}>{label}</text>
      <text x={bx + boxW / 2} y={by + 24} textAnchor="middle" fontSize="9" fontWeight="600" fill={TEXT}>{value}</text>
    </g>
  );
}

// 長條圖(每日淨損益)
function BarChartSVG({ data, color }) {
  if (!data.length) return <div style={{ textAlign: "center", color: MUTED, fontSize: 12, padding: "30px 0" }}>此區間沒有交易紀錄</div>;
  const vals = data.map((d) => d.daily);
  const { min, max, toY, zeroY } = yScale(vals, CHART_H);
  const innerW = CHART_W - PAD_L - PAD_R;
  const bw = Math.max(2, Math.min(18, innerW / data.length * 0.7));
  const toX = (i) => PAD_L + innerW * (i + 0.5) / data.length;
  const toIndexFromX = (vbX) => {
    const i = Math.floor((vbX - PAD_L) / (innerW / data.length));
    return Math.max(0, Math.min(data.length - 1, i));
  };
  const { active, svgRef, bind } = useChartHover(data.length, toIndexFromX);
  const ticks = [max, (max + min) / 2, min];
  const ad = active != null ? data[active] : null;
  return (
    <svg ref={svgRef} {...bind} viewBox={`0 0 ${CHART_W} ${CHART_H}`} style={{ width: "100%", height: "auto", touchAction: "pan-y" }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={PAD_L} y1={toY(t)} x2={CHART_W - PAD_R} y2={toY(t)} stroke={BORDER} strokeWidth="0.5" strokeDasharray="2 2" />
          <text x={PAD_L - 4} y={toY(t) + 3} textAnchor="end" fontSize="8" fill={MUTED}>{fmtAxis(t)}</text>
        </g>
      ))}
      <line x1={PAD_L} y1={zeroY} x2={CHART_W - PAD_R} y2={zeroY} stroke={BORDER} strokeWidth="1" />
      {data.map((d, i) => {
        const y = toY(d.daily);
        const h = Math.abs(y - zeroY);
        return <rect key={i} x={toX(i) - bw / 2} y={Math.min(y, zeroY)} width={bw} height={Math.max(1, h)} rx="1" fill={d.daily >= 0 ? color.profit : color.loss} opacity={active != null && active !== i ? 0.4 : 1} />;
      })}
      {data.map((d, i) => (
        <text key={i} x={toX(i)} y={CHART_H - 6}
          textAnchor={i === 0 ? "start" : i === data.length - 1 ? "end" : "middle"}
          fontSize="7" fill={MUTED}
          style={{ display: (i === 0 || i === data.length - 1 || i === Math.floor(data.length / 2)) ? "block" : "none" }}>{d.date.slice(5)}</text>
      ))}
      {ad && <ChartCursor x={toX(active)} y={toY(ad.daily)} label={ad.date.slice(5)} value={fmtShort(ad.daily)} />}
    </svg>
  );
}

// 散點圖用的氣泡
function ChartCursorXY({ x, y, label, value }) {
  const boxW = 128, boxH = 30;
  let bx = x - boxW / 2;
  if (bx < 2) bx = 2;
  if (bx + boxW > CHART_W - 2) bx = CHART_W - 2 - boxW;
  let by = y - boxH - 8;
  if (by < 2) by = y + 8;
  return (
    <g pointerEvents="none">
      <rect x={bx} y={by} width={boxW} height={boxH} rx="4" fill={PANEL2} stroke={BORDER} strokeWidth="0.5" />
      <text x={bx + boxW / 2} y={by + 12} textAnchor="middle" fontSize="7.5" fill={MUTED}>{label}</text>
      <text x={bx + boxW / 2} y={by + 24} textAnchor="middle" fontSize="9" fontWeight="600" fill={TEXT}>{value}</text>
    </g>
  );
}

// 散點圖(時段表現:X=進場時間 0-24 小時)
function ScatterChartSVG({ data, color }) {
  if (!data.length) return <div style={{ textAlign: "center", color: MUTED, fontSize: 12, padding: "20px 0" }}>新增交易時填寫「進場時間」即可在此顯示</div>;
  const vals = data.map((d) => d.pnl);
  const { min, max, toY, zeroY } = yScale(vals, CHART_H + 20);
  const innerW = CHART_W - PAD_L - PAD_R;
  const toX = (h) => PAD_L + innerW * h / 24;
  const ticks = [max, (max + min) / 2, min];
  const hourTicks = [0, 6, 9, 12, 15, 18, 24];
  const [active, setActive] = useState(null);
  const svgRef = useRef(null);
  const pick = (clientX, clientY) => {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const vbX = ((clientX - rect.left) / rect.width) * CHART_W;
    const vbY = ((clientY - rect.top) / rect.height) * (CHART_H + 20);
    let best = null, bestD = Infinity;
    data.forEach((d, i) => {
      const dx = toX(d.hour) - vbX, dy = toY(d.pnl) - vbY;
      const dist = dx * dx + dy * dy;
      if (dist < bestD) { bestD = dist; best = i; }
    });
    if (best != null && bestD < 400) setActive(best);
  };
  const ad = active != null ? data[active] : null;
  return (
    <svg ref={svgRef}
      onTouchStart={(e) => e.touches[0] && pick(e.touches[0].clientX, e.touches[0].clientY)}
      onTouchMove={(e) => e.touches[0] && pick(e.touches[0].clientX, e.touches[0].clientY)}
      onTouchEnd={() => setActive(null)}
      onMouseMove={(e) => pick(e.clientX, e.clientY)}
      onMouseLeave={() => setActive(null)}
      viewBox={`0 0 ${CHART_W} ${CHART_H + 20}`} style={{ width: "100%", height: "auto", touchAction: "pan-y" }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={PAD_L} y1={toY(t)} x2={CHART_W - PAD_R} y2={toY(t)} stroke={BORDER} strokeWidth="0.5" strokeDasharray="2 2" />
          <text x={PAD_L - 4} y={toY(t) + 3} textAnchor="end" fontSize="8" fill={MUTED}>{fmtAxis(t)}</text>
        </g>
      ))}
      {/* 台股盤中時段 09:00-13:30 淡淡標示 */}

// 時間欄位:只打數字也能存(915 → 09:15、1330 → 13:30),離開欄位時自動補冒號
function normTime(v) {
  const s = (v || "").trim();
  if (/^\d{3,4}$/.test(s)) {
    const p = s.padStart(4, "0");
    return p.slice(0, 2) + ":" + p.slice(2);
  }
  if (/^\d{1,2}:\d{1,2}$/.test(s)) {
    const [h, m] = s.split(":");
    return h.padStart(2, "0") + ":" + m.padStart(2, "0");
  }
  return s;
}

// 把分鐘數格式化成易讀字串
function fmtDuration(mins) {
  if (mins < 1) return Math.round(mins * 60) + "秒";
  if (mins < 60) return Math.round(mins) + "分";
  const h = mins / 60;
  if (h < 24) return (h % 1 === 0 ? h : h.toFixed(1)) + "時";
  return (h / 24).toFixed(1) + "天";
}

// 持倉時長散點圖(對數刻度)
function DurationScatterSVG({ data, color }) {
  if (!data.length) return <div style={{ textAlign: "center", color: MUTED, fontSize: 12, padding: "20px 0" }}>填寫「進場時間」與「出場時間」即可在此顯示</div>;
  const vals = data.map((d) => d.pnl);
  const { min, max, toY, zeroY } = yScale(vals, CHART_H + 20);
  const innerW = CHART_W - PAD_L - PAD_R;
  const maxMins = Math.max(60, ...data.map((d) => d.mins));
  const LOG_MIN = Math.log10(0.05);
  const LOG_MAX = Math.log10(Math.max(60, maxMins * 1.3));
  const toX = (mins) => {
    const lg = Math.log10(Math.max(0.05, mins));
    return PAD_L + innerW * Math.max(0, Math.min(1, (lg - LOG_MIN) / (LOG_MAX - LOG_MIN)));
  };
  const ticks = [max, (max + min) / 2, min];
  const allMarks = [{ m: 1, l: "1分" }, { m: 10, l: "10分" }, { m: 60, l: "1時" }, { m: 330, l: "1盤" }, { m: 1440, l: "1天" }, { m: 10080, l: "7天" }, { m: 43200, l: "30天" }, { m: 129600, l: "90天" }];
  const xMarks = allMarks.filter((mk) => mk.m <= Math.pow(10, LOG_MAX));
  const [active, setActive] = useState(null);
  const svgRef = useRef(null);
  const pick = (cx, cy) => {
    const svg = svgRef.current; if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const vbX = ((cx - rect.left) / rect.width) * CHART_W;
    const vbY = ((cy - rect.top) / rect.height) * (CHART_H + 20);
    let best = null, bestD = Infinity;
    data.forEach((d, i) => {
      const dx = toX(d.mins) - vbX, dy = toY(d.pnl) - vbY, dist = dx * dx + dy * dy;
      if (dist < bestD) { bestD = dist; best = i; }
    });
    if (best != null && bestD < 400) setActive(best);
  };
  const ad = active != null ? data[active] : null;
  return (
    <svg ref={svgRef}
      onTouchStart={(e) => e.touches[0] && pick(e.touches[0].clientX, e.touches[0].clientY)}
      onTouchMove={(e) => e.touches[0] && pick(e.touches[0].clientX, e.touches[0].clientY)}
      onTouchEnd={() => setActive(null)}
      onMouseMove={(e) => pick(e.clientX, e.clientY)}
      onMouseLeave={() => setActive(null)}
      viewBox={`0 0 ${CHART_W} ${CHART_H + 20}`} style={{ width: "100%", height: "auto", touchAction: "pan-y" }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={PAD_L} y1={toY(t)} x2={CHART_W - PAD_R} y2={toY(t)} stroke={BORDER} strokeWidth="0.5" strokeDasharray="2 2" />
          <text x={PAD_L - 4} y={toY(t) + 3} textAnchor="end" fontSize="8" fill={MUTED}>{fmtAxis(t)}</text>
        </g>
      ))}
      <line x1={PAD_L} y1={zeroY} x2={CHART_W - PAD_R} y2={zeroY} stroke={BORDER} strokeWidth="1" />
      {data.map((d, i) => (
        <circle key={i} cx={toX(d.mins)} cy={toY(d.pnl)} r={active === i ? 5 : 3.5} fill={d.win ? color.profit : color.loss} fillOpacity={active != null && active !== i ? 0.3 : 0.65} stroke={active === i ? TEXT : "none"} strokeWidth="1" />
      ))}
      {xMarks.map((mk, i) => (
        <text key={i} x={toX(mk.m)} y={CHART_H + 14} textAnchor="middle" fontSize="8" fill={MUTED}>{mk.l}</text>
      ))}
      {ad && <ChartCursorXY x={toX(ad.mins)} y={toY(ad.pnl)} label={(ad.symbol ? ad.symbol + " " : "") + "持倉" + fmtDuration(ad.mins)} value={fmtShort(ad.pnl)} />}
    </svg>
  );
}

function TradeJournal() {
  const [trades, setTrades] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [dataMenu, setDataMenu] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        let data = await dbGetAll();
        let seededFlag = null;
        try { seededFlag = localStorage.getItem("tj_tw_seeded"); } catch (e) {}
        if ((!data || data.length === 0) && !seededFlag) {
          const seeded = seed();
          await dbBulkPut(seeded);
          try { localStorage.setItem("tj_tw_seeded", "1"); } catch (e) {}
          data = seeded;
        }
        setTrades(data || []);
      } catch (e) {
        console.error("載入失敗", e);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const [tab, setTab] = useState("dashboard");
  const [curveScale, setCurveScale] = useState("history");
  const [customRange, setCustomRange] = useState({ from: "", to: "" });
  const [calMonth, setCalMonth] = useState(() => {
    const t = new Date();
    return { y: t.getFullYear(), m: t.getMonth() };
  });
  const [selectedDay, setSelectedDay] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [editing, setEditing] = useState(null);

  // ---------- 統計 ----------
  const stats = useMemo(() => {
    const closed = trades.filter((t) => typeof t.pnl === "number");
    const n = closed.length;
    const wins = closed.filter((t) => t.pnl > 0);
    const losses = closed.filter((t) => t.pnl < 0);
    const grossWin = wins.reduce((s, t) => s + t.pnl, 0);
    const grossLoss = Math.abs(losses.reduce((s, t) => s + t.pnl, 0));
    const winRate = n ? (wins.length / n) * 100 : 0;
    const avgWin = wins.length ? grossWin / wins.length : 0;
    const avgLoss = losses.length ? grossLoss / losses.length : 0;
    const pf = grossLoss ? grossWin / grossLoss : grossWin > 0 ? Infinity : 0;
    const totalPnl = closed.reduce((s, t) => s + t.pnl, 0);
    const avgR = n ? closed.reduce((s, t) => s + (t.rMultiple || 0), 0) / n : 0;
    const expectancyMoney = n ? totalPnl / n : 0;
    return { n, winRate, pf, avgWin, avgLoss, totalPnl, avgR, expectancyMoney, wins: wins.length, losses: losses.length };
  }, [trades]);

  // ---------- 時間範圍 ----------
  const inScope = useMemo(() => {
    if (curveScale === "history") return () => true;
    if (curveScale === "custom") {
      const from = customRange.from || "0000-00-00";
      const to = customRange.to || "9999-99-99";
      return (date) => date >= from && date <= to;
    }
    const now = new Date();
    const cutoff = new Date(now);
    if (curveScale === "day") cutoff.setDate(now.getDate() - 1);
    if (curveScale === "week") cutoff.setDate(now.getDate() - 7);
    if (curveScale === "month") cutoff.setMonth(now.getMonth() - 1);
    if (curveScale === "year") cutoff.setFullYear(now.getFullYear() - 1);
    const cut = cutoff.toISOString().slice(0, 10);
    return (date) => date >= cut;
  }, [curveScale, customRange]);

  const scopedTrades = useMemo(
    () => trades.filter((t) => typeof t.pnl === "number" && inScope(t.date)),
    [trades, inScope]
  );

  // ---------- 多空分別表現 ----------
  const dirSplit = useMemo(() => {
    const calc = (list) => {
      const n = list.length;
      const wins = list.filter((t) => t.pnl > 0);
      const losses = list.filter((t) => t.pnl < 0);
      const grossWin = wins.reduce((s, t) => s + t.pnl, 0);
      const grossLoss = Math.abs(losses.reduce((s, t) => s + t.pnl, 0));
      const total = list.reduce((s, t) => s + t.pnl, 0);
      return {
        n, wins: wins.length, losses: losses.length,
        winRate: n ? (wins.length / n) * 100 : 0,
        pnl: total,
        pf: grossLoss ? grossWin / grossLoss : grossWin > 0 ? Infinity : 0,
        avgWin: wins.length ? grossWin / wins.length : 0,
        avgLoss: losses.length ? grossLoss / losses.length : 0,
        expectancy: n ? total / n : 0,
      };
    };
    return {
      long: calc(scopedTrades.filter((t) => t.dir === "多")),
      short: calc(scopedTrades.filter((t) => t.dir === "空")),
    };
  }, [scopedTrades]);

  // ---------- 每日淨損益 / 累積 ----------
  const dailyData = useMemo(() => {
    const byDay = {};
    scopedTrades.forEach((t) => { byDay[t.date] = (byDay[t.date] || 0) + t.pnl; });
    const days = Object.keys(byDay).sort();
    let cum = 0;
    return days.map((d) => {
      cum += byDay[d];
      return { date: d, daily: Math.round(byDay[d] * 100) / 100, cum: Math.round(cum * 100) / 100 };
    });
  }, [scopedTrades]);

  const timeScatter = useMemo(() => {
    return scopedTrades
      .filter((t) => t.time && /^\d{1,2}:\d{2}$/.test(t.time))
      .map((t) => {
        const [h, m] = t.time.split(":").map(Number);
        return { hour: h + m / 60, pnl: t.pnl, symbol: t.symbol, date: t.date, win: t.pnl >= 0 };
      });
  }, [scopedTrades]);

  const durationScatter = useMemo(() => {
    const re = /^\d{1,2}:\d{2}$/;
    const toDate = (dateStr, timeStr) => {
      const [y, mo, d] = dateStr.split("-").map(Number);
      const [h, mi] = timeStr.split(":").map(Number);
      return new Date(y, (mo || 1) - 1, d || 1, h, mi);
    };
    return scopedTrades
      .filter((t) => t.date && t.time && t.exitTime && re.test(t.time) && re.test(t.exitTime))
      .map((t) => {
        const entryDt = toDate(t.date, t.time);
        const exitDateStr = t.exitDate && /^\d{4}-\d{1,2}-\d{1,2}$/.test(t.exitDate) ? t.exitDate : t.date;
        const exitDt = toDate(exitDateStr, t.exitTime);
        let mins = (exitDt - entryDt) / 60000;
        if (mins < 0 && !t.exitDate) mins += 24 * 60;
        if (mins < 0) mins = 0;
        return { mins, pnl: t.pnl, symbol: t.symbol, date: t.date, win: t.pnl >= 0 };
      });
  }, [scopedTrades]);

  const periodPnl = useMemo(() => {
    const now = new Date();
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay());
    const ws = weekStart.toISOString().slice(0, 10);
    const monStr = `${calMonth.y}-${String(calMonth.m + 1).padStart(2, "0")}`;
    let week = 0, month = 0;
    trades.forEach((t) => {
      if (typeof t.pnl !== "number") return;
      if (t.date >= ws) week += t.pnl;
      if (t.date.startsWith(monStr)) month += t.pnl;
    });
    return { week, month };
  }, [trades, calMonth]);

  // ---------- 月曆 ----------
  const calendar = useMemo(() => {
    const { y, m } = calMonth;

    trades.forEach((t) => {

      if (t.date.startsWith(`${y}-${String(m + 1).padStart(2, "0")}`)) {

    <div style={{ background: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', system-ui, -apple-system, sans-serif", paddingBottom: "calc(74px + env(safe-area-inset-bottom))" }}>
      <style>{`
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
        input, select, textarea { font-family: inherit; }
        button { cursor: pointer; border: none; font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: ${BORDER}; border-radius: 3px; }
      `}</style>

      {/* Header */}
      <div style={{ padding: "14px 16px 10px", borderBottom: `1px solid ${BORDER}`, position: "sticky", top: 0, background: BG, zIndex: 10 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: 2, color: ACCENT, fontWeight: 600 }}>TW TRADE JOURNAL</div>
            <div style={{ fontSize: 18, fontWeight: 600, marginTop: 1 }}>台股交易日誌</div>
          </div>
          <div style={{ position: "relative" }}>
            <button onClick={() => setDataMenu((v) => !v)} className="mono" style={{ background: PANEL2, color: TEXT, fontSize: 13, padding: "9px 14px", borderRadius: 8, border: `1px solid ${BORDER}` }}>資料 ▾</button>
            {dataMenu && (
              <div style={{ position: "absolute", right: 0, top: "115%", background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 6, zIndex: 20, width: 190, boxShadow: "0 8px 24px rgba(0,0,0,0.5)" }}>
                <div style={{ fontSize: 9, color: MUTED, letterSpacing: 1, padding: "6px 8px 2px" }}>備份 / 還原(含圖片)</div>
                <button onClick={() => { setDataMenu(false); exportJson(); }} style={menuItem}>⬇︎ 備份成 JSON 檔</button>
                <button onClick={() => { setDataMenu(false); jsonInputRef.current.click(); }} style={menuItem}>⬆︎ 從 JSON 還原</button>
                <div style={{ height: 1, background: BORDER, margin: "4px 0" }} />
                <div style={{ fontSize: 9, color: MUTED, letterSpacing: 1, padding: "6px 8px 2px" }}>純數據(不含圖片)</div>
                <button onClick={() => { setDataMenu(false); exportCsv(); }} style={menuItem}>匯出 CSV</button>
                <button onClick={() => { setDataMenu(false); fileInputRef.current.click(); }} style={menuItem}>匯入 CSV</button>
                <div style={{ height: 1, background: BORDER, margin: "4px 0" }} />
                <button onClick={() => { setDataMenu(false); clearAll(); }} style={{ ...menuItem, color: LOSS_COLOR }}>🗑 清除全部紀錄</button>
              </div>
            )}
          </div>
          <input ref={fileInputRef} type="file" accept=".csv,text/csv" onChange={importCsv} style={{ display: "none" }} />
          <input ref={jsonInputRef} type="file" accept=".json,application/json" onChange={importJson} style={{ display: "none" }} />
        </div>
      </div>

      <div style={{ padding: 14 }}>
        {!loaded && <div style={{ color: MUTED, padding: 30, textAlign: "center" }}>載入資料中…</div>}
        {loaded && tab === "dashboard" && (
          <Dashboard stats={stats} periodPnl={periodPnl} dirSplit={dirSplit}
            curveScale={curveScale} setCurveScale={setCurveScale} trades={trades}
            customRange={customRange} setCustomRange={setCustomRange}
            dailyData={dailyData} timeScatter={timeScatter} durationScatter={durationScatter}
            onImgClick={setLightbox} onEdit={startEdit} />
        )}
        {loaded && tab === "calendar" && (
          <Calendar calMonth={calMonth} setCalMonth={setCalMonth} calendar={calendar}
            periodPnl={periodPnl} selectedDay={selectedDay} setSelectedDay={setSelectedDay} dayTrades={dayTrades}
            onImgClick={setLightbox} onEdit={startEdit} />
        )}
        {loaded && tab === "new" && (
          <NewTrade key={editing ? editing.id : "new"} onAdd={addTrade} editing={editing} onUpdate={updateTrade}
            onDelete={deleteTrade} onCancel={() => { setEditing(null); setTab("dashboard"); }} />
        )}
      </div>

      {/* 底部固定導覽(手機拇指好按) */}
      <div style={{
        position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 30,
        background: "rgba(14,17,22,0.96)", borderTop: `1px solid ${BORDER}`,
        backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)",
        display: "flex", padding: "6px 8px calc(6px + env(safe-area-inset-bottom))",
      }}>
        {tabs.map(([k, label, icon]) => {
          const on = tab === k;
          return (
            <button key={k} onClick={() => { if (k !== "new") setEditing(null); setTab(k); }} style={{
              flex: 1, background: "transparent", padding: "8px 0 6px", borderRadius: 10,
              color: on ? ACCENT : MUTED, display: "flex", flexDirection: "column",
              alignItems: "center", gap: 3,
            }}>
              <span style={{ fontSize: 19, lineHeight: 1 }}>{icon}</span>
              <span style={{ fontSize: 11, fontWeight: on ? 600 : 500 }}>{label}</span>
            </button>
          );
        })}
      </div>

      {/* Lightbox 圖片放大 */}
      {lightbox && (
        <div onClick={() => setLightbox(null)} style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)", zIndex: 100,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
        }}>
          <img src={lightbox} alt="放大" style={{ maxWidth: "100%", maxHeight: "100%", borderRadius: 8, objectFit: "contain" }} />
          <button onClick={() => setLightbox(null)} style={{
            position: "fixed", top: "calc(16px + env(safe-area-inset-top))", right: 16,
            background: "rgba(255,255,255,0.15)", color: "#fff",
            width: 42, height: 42, borderRadius: "50%", fontSize: 22, lineHeight: "40px",
          }}>×</button>
        </div>
      )}
    </div>
  );
}

// ============================================================
function StatCard({ label, value, sub, color }) {
  return (
    <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "11px 12px" }}>
      <div style={{ fontSize: 10, letterSpacing: 1, color: MUTED }}>{label}</div>
      <div className="mono" style={{ fontSize: 19, fontWeight: 600, color: color || TEXT, marginTop: 3 }}>{value}</div>
      {sub && <div className="mono" style={{ fontSize: 10.5, color: MUTED, marginTop: 2 }}>{sub}</div>}
    </div>
  );
}

// 多空分別表現(手機:兩欄並排,壓縮版)
function DirSide({ label, s, accent }) {
  // 標籤可縮(必要時省略號),數字不縮,中間永遠留 6px,避免窄螢幕上兩者相撞
  const row = (k, v, color) => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 6, padding: "5px 0", borderTop: `1px solid ${BORDER}` }}>
      <span style={{ fontSize: 10.5, color: MUTED, flexShrink: 1, minWidth: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{k}</span>
      <span className="mono" style={{ fontSize: 11.5, fontWeight: 600, color: color || TEXT, flexShrink: 0, whiteSpace: "nowrap" }}>{v}</span>
    </div>
  );
  const badge = (
    <span style={{ fontSize: 11, padding: "2px 8px", borderRadius: 4, fontWeight: 600, background: accent === PROFIT_COLOR ? profitBg(0.15) : lossBg(0.15), color: accent }}>{label}</span>
  );
  if (!s.n) {
    return (
      <div style={{ background: PANEL2, border: `1px solid ${BORDER}`, borderRadius: 9, padding: "11px 12px" }}>
        {badge}
        <div style={{ color: MUTED, fontSize: 11, padding: "20px 0", textAlign: "center" }}>此範圍沒有{label}單</div>
      </div>
    );
  }
  return (
    <div style={{ background: PANEL2, border: `1px solid ${BORDER}`, borderRadius: 9, padding: "11px 12px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        {badge}
        <span className="mono" style={{ fontSize: 10.5, color: MUTED }}>{s.n} 筆</span>
      </div>
      <div className="mono" style={{ fontSize: 24, fontWeight: 600, marginTop: 7 }}>{s.winRate.toFixed(1)}%</div>
      <div className="mono" style={{ fontSize: 10.5, marginTop: 1 }}>
        <span style={{ color: PROFIT_COLOR }}>{s.wins}勝</span>
        <span style={{ color: MUTED }}> / </span>
        <span style={{ color: LOSS_COLOR }}>{s.losses}敗</span>
      </div>
      <div style={{ display: "flex", height: 6, borderRadius: 3, overflow: "hidden", background: BORDER, marginTop: 7, marginBottom: 6 }}>
        <div style={{ width: s.winRate + "%", background: PROFIT_COLOR }} />
        <div style={{ flex: 1, background: LOSS_COLOR }} />
      </div>
      {row("淨損益", fmtShort(s.pnl), pnlColor(s.pnl))}
      {row("獲利因子", s.pf === Infinity ? "∞" : s.pf.toFixed(2), s.pf >= 1.5 ? PROFIT_COLOR : s.pf >= 1 ? TEXT : LOSS_COLOR)}
      {row("每筆期望", fmtShort(s.expectancy), pnlColor(s.expectancy))}
      {row("平均賺", s.wins ? fmtShort(s.avgWin) : "—", s.wins ? PROFIT_COLOR : MUTED)}
      {row("平均賠", s.losses ? fmtShort(-s.avgLoss) : "—", s.losses ? LOSS_COLOR : MUTED)}
    </div>
  );
}

function DirSplitCard({ split }) {
  const { long, short } = split;
  const total = long.n + short.n;
  const better = long.n && short.n
    ? (long.expectancy === short.expectancy ? null : (long.expectancy > short.expectancy ? "多" : "空"))
    : null;
  return (
    <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "13px 13px 12px" }}>
      <div style={{ fontSize: 13, fontWeight: 600 }}>多空分別表現</div>
      <div style={{ fontSize: 10.5, color: MUTED, marginTop: 2, marginBottom: 10 }}>
        依上方時間範圍
        {total > 0 && <span> · 多 {((long.n / total) * 100).toFixed(0)}% / 空 {((short.n / total) * 100).toFixed(0)}%</span>}
        {better && <span> · 期望值 <span style={{ color: ACCENT, fontWeight: 600 }}>{better}單較佳</span></span>}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 10 }}>
        <DirSide label="多" s={long} accent={PROFIT_COLOR} />
        <DirSide label="空" s={short} accent={LOSS_COLOR} />
      </div>
    </div>
  );
}

function Dashboard({ stats, periodPnl, dirSplit, curveScale, setCurveScale, trades, customRange, setCustomRange, dailyData, timeScatter, durationScatter, onImgClick, onEdit }) {
  const recent = [...trades].sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))).slice(0, 6);
  const inp2 = { background: PANEL2, border: `1px solid ${BORDER}`, borderRadius: 6, color: TEXT, padding: "8px 8px", fontSize: 13, width: "100%" };
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {/* 累積損益大數字 */}
      <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "15px 16px" }}>
        <div style={{ fontSize: 10, letterSpacing: 1, color: MUTED }}>累積損益</div>
        <div className="mono" style={{ fontSize: 28, fontWeight: 600, color: pnlColor(stats.totalPnl), marginTop: 3, letterSpacing: -0.5 }}>{fmtMoney(stats.totalPnl)}</div>
        <div style={{ display: "flex", gap: 18, marginTop: 8 }}>
          <span className="mono" style={{ fontSize: 12, color: MUTED }}>本週 <span style={{ color: pnlColor(periodPnl.week) }}>{fmtShort(periodPnl.week)}</span></span>
          <span className="mono" style={{ fontSize: 12, color: MUTED }}>本月 <span style={{ color: pnlColor(periodPnl.month) }}>{fmtShort(periodPnl.month)}</span></span>
        </div>
      </div>

      {/* 時間範圍 */}
      <div>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
          {[["day","日"],["week","週"],["month","月"],["year","年"],["history","歷史"],["custom","自訂"]].map(([k,l]) => (
            <button key={k} onClick={() => setCurveScale(k)} className="mono" style={{
              flex: 1, fontSize: 12, padding: "9px 0", borderRadius: 7,
              background: curveScale === k ? ACCENT : PANEL2,
              color: curveScale === k ? "#06121c" : MUTED, fontWeight: 600,
            }}>{l}</button>
          ))}
        </div>
        {curveScale === "custom" && (
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
            <input type="date" value={customRange.from}
              onChange={(e) => setCustomRange((p) => ({ ...p, from: e.target.value }))} style={inp2} />
            <span style={{ color: MUTED, fontSize: 12 }}>→</span>
            <input type="date" value={customRange.to}
              onChange={(e) => setCustomRange((p) => ({ ...p, to: e.target.value }))} style={inp2} />
          </div>
        )}
      </div>

      {/* 圖一 */}
      <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "13px 13px 9px" }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>每日淨累積損益</div>
        <AreaLineChart data={dailyData} color={{ profit: PROFIT_COLOR, loss: LOSS_COLOR }} />
      </div>

      {/* 圖二 */}
      <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "13px 13px 9px" }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>每日淨損益</div>
        <BarChartSVG data={dailyData} color={{ profit: PROFIT_COLOR, loss: LOSS_COLOR }} />
      </div>

      {/* 多空分別表現 */}
      <DirSplitCard split={dirSplit} />

      {/* 圖三 */}
      <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "13px 13px 9px" }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>交易時段表現</div>
        <div style={{ fontSize: 10.5, color: MUTED, marginBottom: 6 }}>每點一筆,依進場時間;淺藍區為台股盤中 09:00–13:30</div>
        <ScatterChartSVG data={timeScatter} color={{ profit: PROFIT_COLOR, loss: LOSS_COLOR }} />
      </div>

      {/* 圖四 */}
      <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "13px 13px 9px" }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>持倉時長表現</div>
        <div style={{ fontSize: 10.5, color: MUTED, marginBottom: 6 }}>每點一筆,依持倉時間長短(1盤 = 一個交易日)</div>
        <DurationScatterSVG data={durationScatter} color={{ profit: PROFIT_COLOR, loss: LOSS_COLOR }} />
      </div>

      {/* 統計指標 */}
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 9 }}>
        <StatCard label="勝率" value={stats.winRate.toFixed(1) + "%"} sub={`${stats.wins}勝 / ${stats.losses}敗`} />
        <StatCard label="獲利因子" value={stats.pf === Infinity ? "∞" : stats.pf.toFixed(2)} sub={`${stats.n} 筆已平倉`} color={stats.pf >= 1.5 ? PROFIT_COLOR : stats.pf >= 1 ? TEXT : LOSS_COLOR} />
        <StatCard label="期望值 / 筆" value={fmtR(stats.avgR)} sub={fmtShort(stats.expectancyMoney) + " / 筆"} color={pnlColor(stats.avgR)} />
        <StatCard label="平均盈 / 虧" value={fmtShort(stats.avgWin)} sub={"虧 " + fmtShort(-stats.avgLoss)} />
      </div>

      {/* 近期交易 */}
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>近期交易</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {recent.length === 0 && <div style={{ color: MUTED, fontSize: 12.5, textAlign: "center", padding: "24px 0" }}>還沒有紀錄,點下面「＋ 新增」記第一筆</div>}
          {recent.map((t) => <TradeRow key={t.id} t={t} onImgClick={onImgClick} onEdit={onEdit} />)}
        </div>
      </div>
    </div>
  );
}

function TradeRow({ t, onImgClick, onEdit }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 10, overflow: "hidden" }}>
      <button onClick={() => setOpen(!open)} style={{ width: "100%", background: "transparent", color: TEXT, padding: "11px 13px", display: "flex", justifyContent: "space-between", alignItems: "center", textAlign: "left", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
          <span style={{ fontSize: 10, padding: "2px 6px", borderRadius: 4, background: t.dir === "多" ? profitBg(0.15) : lossBg(0.15), color: t.dir === "多" ? PROFIT_COLOR : LOSS_COLOR, fontWeight: 600, flexShrink: 0 }}>{t.dir}</span>
          <span style={{ fontWeight: 600, fontSize: 14, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{t.symbol}</span>
        </div>
        <div style={{ textAlign: "right", flexShrink: 0 }}>
          {typeof t.pnl === "number" ? (
            <>
              <div className="mono" style={{ color: pnlColor(t.pnl), fontWeight: 600, fontSize: 14 }}>{fmtAmt(t.pnl)}</div>
              <div className="mono" style={{ fontSize: 10.5, color: MUTED }}>{t.rMultiple != null ? fmtR(t.rMultiple) + " · " : ""}{t.date.slice(5)}</div>
            </>
          ) : (
            <>
              <div className="mono" style={{ color: ACCENT, fontWeight: 600, fontSize: 12 }}>未平倉</div>
              <div className="mono" style={{ fontSize: 10.5, color: MUTED }}>{t.date.slice(5)}</div>
            </>
          )}
        </div>
      </button>
      {open && (
        <div style={{ padding: "0 13px 12px", borderTop: `1px solid ${BORDER}` }}>
          {t.strategy && <div className="mono" style={{ fontSize: 11.5, color: ACCENT, paddingTop: 9 }}>{t.strategy}</div>}
          <div className="mono" style={{ fontSize: 12, color: MUTED, display: "flex", gap: 12, flexWrap: "wrap", padding: "8px 0" }}>
            {t.time && <span>⏱ {t.time}{t.exitTime ? " → " + (t.exitDate && t.exitDate !== t.date ? t.exitDate.slice(5) + " " : "") + t.exitTime : ""}</span>}
            <span>進 {fmtNum(t.entry)}</span><span>損 {fmtNum(t.sl)}</span><span>利 {fmtNum(t.tp)}</span><span>出 {fmtNum(t.exit)}</span>
            {t.qty != null && <span>{t.qty} × {t.pointValue}</span>}
            {t.fee != null && <span>費 {t.fee}</span>}
          </div>
          {t.imgs && t.imgs.length > 0 && (
            <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 6, scrollSnapType: "x mandatory" }}>
              {t.imgs.map((src, i) => (
                <img key={i} src={src} alt={"setup" + i} onClick={() => onImgClick && onImgClick(src)}
                  style={{ height: 160, borderRadius: 8, border: `1px solid ${BORDER}`, scrollSnapAlign: "start", flexShrink: 0, cursor: "zoom-in" }} />
              ))}
            </div>
          )}
          {t.reason && <div style={{ marginBottom: 8 }}><span style={{ fontSize: 10, color: ACCENT, letterSpacing: 1 }}>進場理由</span><div style={{ fontSize: 13, marginTop: 2, lineHeight: 1.6 }}>{t.reason}</div></div>}
          {t.review && <div style={{ marginBottom: 10 }}><span style={{ fontSize: 10, color: ACCENT, letterSpacing: 1 }}>檢討</span><div style={{ fontSize: 13, marginTop: 2, lineHeight: 1.6 }}>{t.review}</div></div>}
          <button onClick={() => onEdit && onEdit(t)} style={{ background: PANEL2, color: TEXT, fontSize: 13, fontWeight: 600, padding: "10px 18px", borderRadius: 8, border: `1px solid ${BORDER}` }}>✎ 編輯這筆</button>
        </div>
      )}
    </div>
  );
}

function Calendar({ calMonth, setCalMonth, calendar, periodPnl, selectedDay, setSelectedDay, dayTrades, onImgClick, onEdit }) {
  const nav = (delta) => {
    setSelectedDay(null);
    let { y, m } = calMonth;
    m += delta;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setCalMonth({ y, m });
  };
  const weekdays = ["日","一","二","三","四","五","六"];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <button onClick={() => nav(-1)} className="mono" style={{ background: PANEL2, color: TEXT, padding: "9px 16px", borderRadius: 8, border: `1px solid ${BORDER}`, fontSize: 15 }}>‹</button>
        <div style={{ textAlign: "center" }}>
          <div className="mono" style={{ fontSize: 16, fontWeight: 600 }}>{calMonth.y}年 {calMonth.m + 1}月</div>
          <div className="mono" style={{ fontSize: 12, color: pnlColor(periodPnl.month) }}>本月 {fmtMoney(periodPnl.month)}</div>
        </div>
        <button onClick={() => nav(1)} className="mono" style={{ background: PANEL2, color: TEXT, padding: "9px 16px", borderRadius: 8, border: `1px solid ${BORDER}`, fontSize: 15 }}>›</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,minmax(0,1fr))", gap: 3 }}>
        {weekdays.map((w) => <div key={w} style={{ textAlign: "center", fontSize: 11, color: MUTED, padding: "2px 0" }}>{w}</div>)}
        {calendar.map((c, i) => {
          if (!c) return <div key={i} />;
          const has = c.count > 0;
          const sel = selectedDay === c.d;
          return (
            <button key={i} onClick={() => setSelectedDay(has ? (sel ? null : c.d) : null)} style={{
              aspectRatio: "1", borderRadius: 8, padding: 2, display: "flex", flexDirection: "column",
              justifyContent: "space-between", alignItems: "stretch",
              background: has ? (c.pnl > 0 ? profitBg(0.13) : lossBg(0.13)) : PANEL,
              border: sel ? `1.5px solid ${ACCENT}` : `1px solid ${has ? (c.pnl > 0 ? profitBg(0.4) : lossBg(0.4)) : BORDER}`,
            }}>
              <span className="mono" style={{ fontSize: 10.5, color: MUTED, textAlign: "left" }}>{c.d}</span>
              {has && <>
                <span className="mono" style={{ fontSize: 10, fontWeight: 600, color: pnlColor(c.pnl), lineHeight: 1.1 }}>{fmtShort(c.pnl)}</span>
                <span className="mono" style={{ fontSize: 8.5, color: MUTED, textAlign: "right" }}>{c.count}筆</span>
              </>}
            </button>
          );
        })}
      </div>

      {selectedDay && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>{calMonth.m + 1}/{selectedDay} 當日交易</div>
          {dayTrades.map((t) => <TradeRow key={t.id} t={t} onImgClick={onImgClick} onEdit={onEdit} />)}
        </div>
      )}
    </div>
  );
}

function NewTrade({ onAdd, editing, onUpdate, onDelete, onCancel }) {
  const isEdit = !!editing;
  const blank = {
    date: new Date().toISOString().slice(0, 10), time: "", exitDate: "", exitTime: "", symbol: "", dir: "多", strategy: "",
    entry: "", sl: "", tp: "", exit: "", qty: "", pointValue: "", fee: "",
    reason: "", review: "", imgs: [],
  };
  const [f, setF] = useState(() => {
    if (!editing) return blank;
    const toStr = (v) => (v == null ? "" : String(v));
    return {
      date: editing.date, time: editing.time || "", exitDate: editing.exitDate || "", exitTime: editing.exitTime || "",
      symbol: editing.symbol || "", dir: editing.dir || "多", strategy: editing.strategy || "",
      entry: toStr(editing.entry), sl: toStr(editing.sl), tp: toStr(editing.tp), exit: toStr(editing.exit),
      qty: toStr(editing.qty), pointValue: toStr(editing.pointValue), fee: toStr(editing.fee),
      reason: editing.reason || "", review: editing.review || "", imgs: editing.imgs || [],
    };
  });
  const fileRef = useRef();
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));

  const onImg = (e) => {
    const files = Array.from(e.target.files);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = () => setF((p) => ({ ...p, imgs: [...p.imgs, reader.result] }));
      reader.readAsDataURL(file);
    });
    e.target.value = "";
  };
  const removeImg = (i) => setF((p) => ({ ...p, imgs: p.imgs.filter((_, idx) => idx !== i) }));

  const entry = parseFloat(f.entry), sl = parseFloat(f.sl), exit = parseFloat(f.exit);
  const qty = parseFloat(f.qty), pv = parseFloat(f.pointValue), fee = parseFloat(f.fee) || 0;
  const dir = f.dir === "多" ? 1 : -1;

  const pnl = useMemo(() => {
    if ([entry, exit, qty, pv].some(isNaN)) return null;
    return (exit - entry) * dir * qty * pv - fee;
  }, [entry, exit, qty, pv, fee, dir]);

  const risk = useMemo(() => {
    if ([entry, sl, qty, pv].some(isNaN)) return null;
    return Math.abs(entry - sl) * qty * pv;
  }, [entry, sl, qty, pv]);

  const rMultiple = useMemo(() => {
    if (pnl == null || risk == null || risk === 0) return null;
    return pnl / risk;
  }, [pnl, risk]);

  const submit = () => {
    if (!f.symbol) { alert("請輸入商品"); return; }
    const hasPnl = pnl != null;
    const payload = {
      ...f,
      entry: entry || null, sl: sl || null, tp: parseFloat(f.tp) || null, exit: exit || null,
      qty: qty || null, pointValue: pv || null, fee,
      risk: risk ?? null,
      pnl: hasPnl ? Math.round(pnl * 100) / 100 : null,
      rMultiple: rMultiple ?? null,
      open: !hasPnl,
    };
    if (isEdit) onUpdate({ ...payload, id: editing.id });
    else onAdd(payload);
  };

  const inp = { width: "100%", background: PANEL2, border: `1px solid ${BORDER}`, borderRadius: 8, color: TEXT, padding: "11px 12px", fontSize: 16, marginTop: 4 };
  const lbl = { fontSize: 11.5, color: MUTED, letterSpacing: 0.3 };
  const quick = (label, key, val) => (
    <button onClick={() => set(key, String(val))} style={{
      background: f[key] === String(val) ? ACCENT : PANEL2, color: f[key] === String(val) ? "#06121c" : MUTED,
      fontSize: 12, fontWeight: 600, padding: "8px 12px", borderRadius: 6, border: `1px solid ${BORDER}`,
    }}>{label}</button>
  );
  // 方向:改用左右兩顆按鈕(比下拉選單快一下)
  const dirBtn = (v) => {
    const on = f.dir === v;
    const c = v === "多" ? PROFIT_COLOR : LOSS_COLOR;
    return (
      <button onClick={() => set("dir", v)} style={{
        flex: 1, minWidth: 0, padding: "11px 0", borderRadius: 8, fontSize: 16, fontWeight: 600,
        background: on ? (v === "多" ? profitBg(0.18) : lossBg(0.18)) : PANEL2,
        color: on ? c : MUTED,
        border: `1px solid ${on ? c : BORDER}`,
      }}>{v}</button>
    );
  };
  const quickRow = (children) => (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 6 }}>
      <span style={{ fontSize: 11, color: MUTED }}>快選:</span>{children}
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1.5fr) minmax(0,1fr)", gap: 10 }}>
        <div style={{ minWidth: 0 }}><div style={lbl}>進場日期</div>
          <input type="date" value={f.date} onChange={(e) => set("date", e.target.value)} style={inp} /></div>
        <div style={{ minWidth: 0 }}><div style={lbl}>方向</div>
          <div style={{ display: "flex", gap: 6, marginTop: 4 }}>{dirBtn("多")}{dirBtn("空")}</div>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 10 }}>
        <div style={{ minWidth: 0 }}><div style={lbl}>進場時間</div>
          <input type="text" inputMode="numeric" placeholder="09:15" value={f.time}
            onChange={(e) => set("time", e.target.value)}
            onBlur={(e) => set("time", normTime(e.target.value))} style={inp} /></div>
        <div style={{ minWidth: 0 }}><div style={lbl}>出場時間</div>
          <input type="text" inputMode="numeric" placeholder="13:30" value={f.exitTime}
            onChange={(e) => set("exitTime", e.target.value)}
            onBlur={(e) => set("exitTime", normTime(e.target.value))} style={inp} /></div>
      </div>
      <div style={{ fontSize: 11, color: MUTED, marginTop: -6 }}>時間可只打數字,例如 915 會自動變成 09:15</div>
      <div>
        <div style={lbl}>出場日期(當沖留空,波段跨日才填)</div>
        <input type="date" value={f.exitDate} onChange={(e) => set("exitDate", e.target.value)} style={inp} />
      </div>

      <div>
        <div style={lbl}>商品</div>
        <input placeholder="2330 台積電 / TXF 台指期" value={f.symbol} onChange={(e) => set("symbol", e.target.value)} style={inp} />
        {quickRow(quick("微台指", "symbol", "微台指"))}
      </div>
      <div>
        <div style={lbl}>策略</div>
        <input placeholder="潛伏埋伏 / Qulla / 開盤突破" value={f.strategy} onChange={(e) => set("strategy", e.target.value)} style={inp} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 10 }}>
        <div style={{ minWidth: 0 }}><div style={lbl}>數量(張/口)</div><input type="number" inputMode="decimal" value={f.qty} onChange={(e) => set("qty", e.target.value)} style={inp} /></div>
        <div style={{ minWidth: 0 }}><div style={lbl}>點值(每點/單位)</div><input type="number" inputMode="decimal" value={f.pointValue} onChange={(e) => set("pointValue", e.target.value)} style={inp} /></div>
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: -4 }}>
        <span style={{ fontSize: 11, color: MUTED }}>點值快選:</span>
        {quick("股票 1張 1000", "pointValue", 1000)}
        {quick("微台 10", "pointValue", 10)}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 10 }}>
        <div style={{ minWidth: 0 }}><div style={lbl}>進場價</div><input type="number" inputMode="decimal" value={f.entry} onChange={(e) => set("entry", e.target.value)} style={inp} /></div>
        <div style={{ minWidth: 0 }}><div style={lbl}>出場價</div><input type="number" inputMode="decimal" value={f.exit} onChange={(e) => set("exit", e.target.value)} style={inp} /></div>
        <div style={{ minWidth: 0 }}><div style={lbl}>停損價</div><input type="number" inputMode="decimal" value={f.sl} onChange={(e) => set("sl", e.target.value)} style={inp} /></div>
        <div style={{ minWidth: 0 }}><div style={lbl}>停利價 (TP)</div><input type="number" inputMode="decimal" value={f.tp} onChange={(e) => set("tp", e.target.value)} style={inp} /></div>
      </div>
      <div>
        <div style={lbl}>手續費 + 稅(總額)</div>
        <input type="number" inputMode="decimal" placeholder="手續費與證交稅/期交稅加總" value={f.fee} onChange={(e) => set("fee", e.target.value)} style={inp} />
        {quickRow(quick("118(買59+賣59)", "fee", 118))}
      </div>

      {/* 自動計算結果 */}
      <div style={{ background: PANEL, borderRadius: 10, border: `1px solid ${BORDER}`, padding: "13px 10px", display: "flex", justifyContent: "space-around", textAlign: "center" }}>
        <div style={{ minWidth: 0, flex: 1 }}>
          <div style={{ fontSize: 10, color: MUTED, letterSpacing: 1 }}>損益</div>
          <div className="mono" style={{ fontSize: 16, fontWeight: 600, color: pnl == null ? MUTED : pnlColor(pnl), marginTop: 3 }}>{pnl == null ? "—" : fmtShort(pnl)}</div>
        </div>
        <div style={{ width: 1, background: BORDER }} />
        <div style={{ minWidth: 0, flex: 1 }}>
          <div style={{ fontSize: 10, color: MUTED, letterSpacing: 1 }}>風險額</div>
          <div className="mono" style={{ fontSize: 16, fontWeight: 600, marginTop: 3 }}>{risk == null ? "—" : fmtShort(risk).replace("+", "")}</div>
        </div>
        <div style={{ width: 1, background: BORDER }} />
        <div style={{ minWidth: 0, flex: 1 }}>
          <div style={{ fontSize: 10, color: MUTED, letterSpacing: 1 }}>實際 R</div>
          <div className="mono" style={{ fontSize: 16, fontWeight: 600, color: rMultiple == null ? MUTED : pnlColor(rMultiple), marginTop: 3 }}>{rMultiple == null ? "—" : fmtR(rMultiple)}</div>
        </div>
      </div>
      {pnl != null && (
        <div className="mono" style={{ fontSize: 12, color: MUTED, textAlign: "center", marginTop: -6 }}>
          損益 {fmtMoney(pnl)}{risk != null && risk > 0 ? " · 風險額 " + CCY + risk.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 }) : ""}
        </div>
      )}

      <div><div style={lbl}>進場理由</div>
        <textarea rows={2} placeholder="為什麼進場?符合哪些 setup 條件?" value={f.reason} onChange={(e) => set("reason", e.target.value)} style={{ ...inp, resize: "vertical", lineHeight: 1.6 }} /></div>
      <div><div style={lbl}>檢討</div>
        <textarea rows={3} placeholder="執行得如何?有沒有違反規則?下次改什麼?" value={f.review} onChange={(e) => set("review", e.target.value)} style={{ ...inp, resize: "vertical", lineHeight: 1.6 }} /></div>

      <div>
        <div style={lbl}>截圖(可多張:進場前 / 進場 / 出場復盤)</div>
        <button onClick={() => fileRef.current.click()} style={{ width: "100%", background: PANEL2, color: MUTED, border: `1px dashed ${BORDER}`, borderRadius: 8, padding: "16px", fontSize: 13, marginTop: 4 }}>
          ＋ 上傳截圖(可一次選多張)
        </button>
        <input ref={fileRef} type="file" accept="image/*" multiple onChange={onImg} style={{ display: "none" }} />
        {f.imgs.length > 0 && (
          <div style={{ display: "flex", gap: 8, overflowX: "auto", marginTop: 8, paddingBottom: 6 }}>
            {f.imgs.map((src, i) => (
              <div key={i} style={{ position: "relative", flexShrink: 0 }}>
                <img src={src} alt={"preview" + i} style={{ height: 120, borderRadius: 8, border: `1px solid ${BORDER}` }} />
                <button onClick={() => removeImg(i)} style={{ position: "absolute", top: 4, right: 4, background: "rgba(0,0,0,0.75)", color: "#fff", borderRadius: "50%", width: 24, height: 24, fontSize: 15, lineHeight: "22px" }}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <button onClick={submit} style={{ background: ACCENT, color: "#06121c", fontWeight: 600, fontSize: 16, padding: "15px", borderRadius: 10, marginTop: 4 }}>{isEdit ? "更新交易" : "儲存交易"}</button>
      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={onCancel} style={{ flex: 1, background: PANEL2, color: TEXT, fontWeight: 600, fontSize: 14, padding: "13px", borderRadius: 10, border: `1px solid ${BORDER}` }}>取消</button>
        {isEdit && (
          <button onClick={() => { if (confirm("確定刪除這筆交易?")) onDelete(editing.id); }} style={{ flex: 1, background: "transparent", color: LOSS_COLOR, fontWeight: 600, fontSize: 14, padding: "13px", borderRadius: 10, border: `1px solid ${LOSS_COLOR}` }}>刪除</button>
        )}
      </div>
    </div>
  );
}

// ============================================================
// 掛載
// ============================================================
const rootEl = document.getElementById("root");
if (window.__loadTimeout) clearTimeout(window.__loadTimeout);
try {
  ReactDOM.createRoot(rootEl).render(<TradeJournal />);
} catch (err) {
  rootEl.innerHTML = '<div style="color:#e8482b;font-family:monospace;padding:40px 20px;font-size:13px;white-space:pre-wrap;">渲染錯誤:\n' + (err && err.message ? err.message : String(err)) + '</div>';
}
</script>

<script>
// 等所有外部元件就緒後,手動編譯 app 原始碼(與其他版本相同的 loader,勿改)
(function () {
  function ready() {
    var l = window.__libsLoaded;
    return l.react && l.dom && l.babel && window.Babel;
  }
  function run() {
    try {
      var src = document.getElementById("app-source").textContent;
      var compiled = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]],
        sourceType: "script",
      }).code;
      compiled = compiled
        .replace(/^\s*import\s+.*?;?\s*$/gm, "")
        .replace(/^\s*export\s+default\s+/gm, "")
        .replace(/^\s*export\s+\{[^}]*\}\s*;?\s*$/gm, "")
        .replace(/^\s*export\s+/gm, "")
        .replace(/"use strict";/g, "");
      if (window.__loadTimeout) clearTimeout(window.__loadTimeout);
      var requireShim = function (name) {
        if (name === "react") return window.React;
        if (name === "react-dom" || name === "react-dom/client") return window.ReactDOM;
        return {};
      };
      var wrapped = "(function(require, exports, module){\n" + compiled + "\n})";
      (new Function("return " + wrapped)())(requireShim, {}, { exports: {} });
    } catch (err) {
      var root = document.getElementById("root");
      root.innerHTML = '<div style="color:#e8482b;font-family:monospace;padding:40px 20px;font-size:12px;white-space:pre-wrap;word-break:break-word;">編譯/執行錯誤:\n' +
        (err && err.message ? err.message : String(err)) +
        (err && err.stack ? '\n\n' + err.stack : '') + '</div>';
    }
  }
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    if (ready()) { clearInterval(iv); run(); }
    else if (tries > 150) { clearInterval(iv); }
  }, 200);
})();
</script>
